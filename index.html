*{
  box-sizing:border-box;
}

body{
  margin:0;

}

.header{
  text-align:center;
  padding:35px 15px 25px;

  border-bottom:1px solid #292929;
}

.header h1{
  margin:0;
  font-size:32px;
}

.header p{
  color:#aaa;
  margin:10px 0 0;
}

.container{
  width:94%;
  max-width:1200px;
  margin:25px auto 50px;
}

.categories{
  display:flex;
  justify-content:center;
  margin-bottom:25px;
}

#category{
  width:100%;
  max-width:500px;
  padding:15px;
  border-radius:12px;
  border:1px solid #444;
  background:#171717;
  color:white;
  font-size:16px;
  outline:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.card img{
  width:100%;
  height:330px;
  object-fit:cover;
  display:block;
  background:#222;
}

.photo-title{
  padding:8px 14px;
  color:#888;
  font-size:11px;
  letter-spacing:1px;
  border-bottom:1px solid #292929;
}

.info{
  padding:18px;
}

.number{
  color:#777;
  font-size:12px;
  margin-bottom:8px;
}

.title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:9px;
}

.tag{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#262626;
  color:#ddd;
  font-size:12px;
  margin-bottom:14px;
}

.prompt{
  background:#0d0d0d;
  border:1px solid #292929;
  border-radius:12px;
  padding:14px;
  color:#d5d5d5;
  font-size:14px;
  line-height:1.65;
  max-height:250px;
  overflow:auto;
}

.copy{
  width:100%;
  margin-top:14px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:white;
  color:black;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.copy:hover{
  background:#ddd;
}

.copy.done{
  background:#22c77a;
  color:white;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .header h1{
    font-size:27px;
  }

  .card img{
    height:360px;
  }
}

.footer{
  text-align:center;
  color:#777;
  padding:25px;
  border-top:1px solid #222;
  font-size:13px;
}
</style>
