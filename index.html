<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Prompt Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#071326;color:#fff}
header{padding:22px 16px;text-align:center;background:#0b1b35;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:30px}header p{margin:7px 0 0;color:#b9c8e5}
.hero{margin:14px;padding:30px 20px;border-radius:22px;text-align:center;background:linear-gradient(135deg,#ff8a00,#f2298f,#633cff)}
.hero h2{font-size:28px;margin:0 0 10px}.hero p{margin:0;line-height:1.5}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.nav button{border:0;border-radius:14px;padding:15px 6px;background:#102542;color:#fff;font-weight:bold}
section{padding:8px 14px 18px}.title{font-size:25px;font-weight:800;margin:18px 4px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#0e203b;border:1px solid #1c3b62;border-radius:16px;overflow:hidden}
.card img{width:100%;height:170px;object-fit:cover;display:block}
.content{padding:12px}.content h3{font-size:17px;margin:0 0 8px}.prompt{font-size:13px;line-height:1.45;color:#d5def0}
.copy{margin-top:10px;width:100%;padding:10px;border:0;border-radius:10px;background:#4d5cff;color:#fff;font-weight:bold}
footer{text-align:center;padding:28px;color:#aebbd1;background:#06101f}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.card img{height:145px}}
</style>
</head>
<body>
<header><h1>✨ AI Prompt Hub</h1><p>Create • Imagine • Generate</p></header>
<div class="hero"><h2>🔥 Trending AI Photo & Video Prompts</h2><p>Ready-made prompts for amazing AI photos and videos. Copy, paste and create.</p></div>

<div class="nav">
<button onclick="go('boy')">👦 Boy</button><button onclick="go('girl')">👧 Girl</button>
<button onclick="go('couple')">❤️ Couple</button><button onclick="go('trending')">🔥 Trending</button>
<button onclick="go('video')">🎬 Video</button><button onclick="go('festival')">🎁 Festival</button>
</div>

<div id="app"></div>
<footer>Made with ❤️ for AI creators • AI Prompt Hub</footer>

function esc(s){return s.replace(/'/g,"\\'")}
function render(key){
 const items=data[key]; const title=key[0].toUpperCase()+key.slice(1);
 document.getElementById("app").innerHTML=`<section id="${key}"><div class="title">${title} Prompts</div><div class="grid">`+
 items.map((x,i)=>`<div class="card"><img src="${x[1]}?auto=format&fit=crop&w=900&q=85" alt="${x[0]}"><div class="content"><h3>${x[0]}</h3><div class="prompt" id="${key}${i}">${x[2]}</div><button class="copy" onclick="copyText('${key}${i}')">📋 Copy Prompt</button></div></div>`).join("")+
 `</div></section>`;
}
function copyText(id){navigator.clipboard.writeText(document.getElementById(id).innerText);alert("Prompt copied! ✅")}
function go(key){render(key);document.getElementById("app").scrollIntoView({behavior:"smooth"})}
render("boy");
</script>
</body>
</html>
