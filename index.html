body{

header{

.reference-photo{

  width:100%;
  height:420px;
  background:#222735;
  overflow:hidden;
}

.reference-photo img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
}

.photo-label{
  position:absolute;
  top:16px;
  left:16px;
  background:rgba(0,0,0,.78);
  color:white;
  padding:10px 14px;
  border-radius:9px;
  font-size:13px;

.content{

.number{

h2{

.tag{

  padding:8px 13px;
  border-radius:20px;
  background:#30204e;
  color:#d6baff;
  font-size:13px;
  margin-bottom:17px;
}

.prompt{

  border-radius:14px;
  padding:16px;
  color:#dfe3ed;
  line-height:1.7;
  font-size:14px;

.copy-btn{

  border-radius:12px;
  background:#7c4dff;
  color:white;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.copy-btn:active{

footer{

  color:#777f92;
  padding:40px 20px;
  font-size:13px;

@media(max-width:600px){

function createCard(item,index){

  return `
  <div class="card">

    <div class="reference-photo">

      <img
        src="${item.image}"
        alt="${item.title} reference photo"
        loading="lazy"
        onerror="this.style.display='none';"
      >

      <div class="photo-label">
        REFERENCE PHOTO
      </div>

    </div>


    <div class="content">

      <div class="number">
        BOY PROMPT #${String(index+1).padStart(2,"0")}
      </div>

      <h2>${item.title}</h2>

      <div class="tag">
        ${item.tag}
      </div>

      <div class="prompt">
        ${item.prompt}
      </div>

      <button class="copy-btn" onclick="copyPrompt(this)">
        📋 Copy Prompt
      </button>

    </div>

  </div>
  `;

}


function loadBoys(){

  const cards=document.getElementById("cards");

  cards.innerHTML=boys
    .map((item,index)=>createCard(item,index))
    .join("");

}


function copyPrompt(button){

  const prompt=button
    .parentElement
    .querySelector(".prompt")
    .innerText;

  navigator.clipboard.writeText(prompt)
  .then(()=>{

    const oldText=button.innerText;

    button.innerText="✅ Copied!";

    setTimeout(()=>{
      button.innerText=oldText;
    },1500);

  })
  .catch(()=>{

    alert("Please select and copy the prompt manually.");

  });

}
